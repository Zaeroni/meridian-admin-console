server:
  port: 8080

spring:
  application:
    name: meridian-admin-console
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meridian}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

meridian:
  jwt:
    # Local development default only. Set JWT_SECRET to a long random value anywhere else.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    expiration-minutes: 480
  seed:
    enabled: ${SEED_ENABLED:false}
  queue:
    # Open applications older than this are flagged as needing attention.
    attention-hours-review: 48
    attention-days-more-info: 7
    # Live pharmacies whose license expires within this many days are flagged.
    license-expiry-warning-days: 30

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
